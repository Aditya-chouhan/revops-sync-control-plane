[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revops-sync-control-plane"
version = "0.1.0"
description = "Auditable HubSpot-Salesforce identity resolution, conflict handling, and sync previews."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aditya Chouhan" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.14,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
revops-sync = "revops_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revops_sync"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["revops_sync"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.coverage.run]
source = ["revops_sync"]
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
